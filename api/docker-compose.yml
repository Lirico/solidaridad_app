services:
  db:
    image: postgres:16
    container_name: solidaridad-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solidaridad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solidaridad}
      POSTGRES_DB: ${POSTGRES_DB:-solidaridad}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - solidaridad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solidaridad} -d ${POSTGRES_DB:-solidaridad}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  solidaridad_pgdata:
