services:
  mysql:
    image: mysql:5.7
    # mysql:5.7 has no linux/arm64 image; force amd64 (Rosetta/QEMU on Apple Silicon)
    platform: linux/amd64
    container_name: solidaridad-processor-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kigsolidario2}
      MYSQL_USER: ${MYSQL_USER:-kigadmin2}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-localdev}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - processor_mysqldata:/var/lib/mysql
      - ./docker/mysql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./docker/mysql/02_seed.sql.gz:/docker-entrypoint-initdb.d/02_seed.sql.gz:ro
      - ./utils/demo/03_fix_demo.sql:/docker-entrypoint-initdb.d/03_fix_demo.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-localroot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solidaridad-processor-auth
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${AUTH_HOST_PORT:-4452}:4452"
    volumes:
      - ./docker/authkig.conf:/app/authkig.conf:ro

volumes:
  processor_mysqldata:
